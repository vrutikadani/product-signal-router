name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - name: Tests (unit, adversarial, pipeline)
        run: python -m pytest -q
      - name: Committed evaluation report is current
        run: python evals/run_eval.py --check
      - name: Demo manifest is current
        run: |
          python scripts/build_manifest.py
          git diff --exit-code web/py_manifest.json
      - name: Engine is standard library only (the browser demo depends on it)
        run: |
          if grep -rnE "^(from|import) " product_signal_router --include=*.py | grep -vE "from (\.|__future__)|import (json|random|dataclasses|datetime|enum|typing|collections|statistics)|from (dataclasses|datetime|enum|typing|collections|statistics) "; then
            echo "non-stdlib import in engine"; exit 1
          fi
